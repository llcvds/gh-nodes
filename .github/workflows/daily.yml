name: Daily nodes

on:
  schedule:
    # 每天 22:10 UTC = 北京时间 06:10
    - cron: "10 22 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "sources.txt"
      - "scripts/**"

concurrency:
  group: daily-nodes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"

      # ---- 1. 抓取 + 去重 + 静态校验 + TCP 粗筛 ----
      # TCP 只是粗筛: 快, 但会把 Cloudflare anycast 的节点全判为可用
      - name: Aggregate (TCP prefilter)
        run: |
          python3 scripts/aggregate.py \
            --limit 30000 \
            --concurrency 800 \
            --probe-timeout 3 \
            --workers 32

      # ---- 2. 装 mihomo 内核, 做真实握手验证 ----
      - name: Install mihomo
        run: |
          set -euo pipefail
          URL=$(gh api repos/MetaCubeX/mihomo/releases/latest \
                --jq '.assets[].browser_download_url' \
                | grep -E 'linux-amd64.*\.gz$' | grep -v compatible | head -1)
          echo "下载: $URL"
          curl -sSL --retry 3 -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify real HTTPS handshake
        run: |
          python3 scripts/verify_http.py \
            --out output \
            --mihomo ./mihomo \
            --workers 150 \
            --batch 2500 \
            --timeout 5000 \
            --keep 1200

      # ---- 3. 用验证后的节点重新生成订阅 ----
      - name: Rebuild outputs
        run: |
          python3 scripts/aggregate.py --from-json output/nodes.json --limit 1200

      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import base64, json, sys
          from pathlib import Path

          sub = Path("output/sub.txt")
          yml = Path("output/mihomo.yaml")
          if not sub.exists() or not yml.exists():
              sys.exit("输出文件缺失")

          dec = base64.b64decode(sub.read_text().strip()).decode()
          uris = [l for l in dec.splitlines() if l.strip()]
          print(f"订阅 URI: {len(uris)} 条")
          if not uris:
              sys.exit("订阅为空")

          stats = json.loads(Path("output/stats.json").read_text())
          print(f"节点数: {stats['nodes_final']}")
          print(f"协议:   {stats['protocols']}")
          print(f"延迟:   最快 {stats['fastest_ms']}ms / 中位 {stats['median_ms']}ms")

          nodes = json.loads(Path("output/nodes.json").read_text())
          names = [n["name"] for n in nodes]
          dup = len(names) - len(set(names))
          if dup:
              sys.exit(f"存在 {dup} 个重名节点")
          print("名称唯一性: OK")

          # 延迟为 0 说明验证没生效 (CF anycast 特征)
          zero = sum(1 for n in nodes if n.get("_delay", 1) == 0)
          print(f"零延迟节点: {zero}")
          if zero > len(nodes) * 0.2:
              sys.exit("零延迟节点过多, 真实验证可能未生效")
          PY

      - name: Commit & push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          # 关键: 用 soft reset 把 HEAD 挪到最新 main, 索引里保留本次生成的内容。
          # 原写法是「先 commit 再 pull --rebase」, 远端一有并发提交就冲突,
          # 冲突后还会留下 detached HEAD, 后续重试全部报
          # "You are not currently on a branch"。soft reset 不会产生冲突。
          git reset --soft origin/main
          git add -A
          if git diff --staged --quiet; then
            echo "无变化, 跳过提交"
            exit 0
          fi
          N=$(grep -cE 'name:' output/mihomo.yaml 2>/dev/null || true)
          N=${N:-0}
          MSG="chore: 更新节点 ${N} 个 [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败, 5s 后重试"
            sleep 5
            git fetch origin main
            git reset --soft origin/main
            git add -A
          done
          echo "推送失败"
          exit 1
