name: Daily nodes

on:
  schedule:
    # 每天 22:10 UTC = 北京时间 06:10
    - cron: "10 22 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "sources.txt"
      - "scripts/**"

concurrency:
  group: daily-nodes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"

      # ---- 1. 抓取 + 去重 + 静态校验 + TCP 粗筛 ----
      # TCP 只是粗筛: 快, 但会把 Cloudflare anycast 的节点全判为可用
      - name: Aggregate (TCP prefilter)
        run: |
          python3 scripts/aggregate.py \
            --limit 6000 \
            --concurrency 800 \
            --probe-timeout 3 \
            --workers 32

      # ---- 2. 装 mihomo 内核, 做真实握手验证 ----
      - name: Install mihomo
        run: |
          set -euo pipefail
          URL=$(gh api repos/MetaCubeX/mihomo/releases/latest \
                --jq '.assets[].browser_download_url' \
                | grep -E 'linux-amd64.*\.gz$' | grep -v compatible | head -1)
          echo "下载: $URL"
          curl -sSL --retry 3 -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify real HTTPS handshake
        run: |
          python3 scripts/verify_http.py \
            --out output \
            --mihomo ./mihomo \
            --workers 150 \
            --batch 2000 \
            --timeout 5000 \
            --keep 1500

      # ---- 3. 用验证后的节点重新生成订阅 ----
      - name: Rebuild outputs
        run: |
          python3 scripts/aggregate.py --from-json output/nodes.json --limit 1500

      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import base64, json, sys
          from pathlib import Path

          sub = Path("output/sub.txt")
          yml = Path("output/mihomo.yaml")
          if not sub.exists() or not yml.exists():
              sys.exit("输出文件缺失")

          dec = base64.b64decode(sub.read_text().strip()).decode()
          uris = [l for l in dec.splitlines() if l.strip()]
          print(f"订阅 URI: {len(uris)} 条")
          if not uris:
              sys.exit("订阅为空")

          stats = json.loads(Path("output/stats.json").read_text())
          print(f"节点数: {stats['nodes_final']}")
          print(f"协议:   {stats['protocols']}")
          print(f"延迟:   最快 {stats['fastest_ms']}ms / 中位 {stats['median_ms']}ms")

          nodes = json.loads(Path("output/nodes.json").read_text())
          names = [n["name"] for n in nodes]
          dup = len(names) - len(set(names))
          if dup:
              sys.exit(f"存在 {dup} 个重名节点")
          print("名称唯一性: OK")

          # 延迟为 0 说明验证没生效 (CF anycast 特征)
          zero = sum(1 for n in nodes if n.get("_delay", 1) == 0)
          print(f"零延迟节点: {zero}")
          if zero > len(nodes) * 0.2:
              sys.exit("零延迟节点过多, 真实验证可能未生效")
          PY

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "内容未变, 跳过提交"
          else
            N=$(python3 -c "import json;print(json.load(open('output/stats.json'))['nodes_final'])")
            git commit -m "chore: 更新节点 ${N} 个 [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
